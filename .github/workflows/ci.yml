name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Verify CLI entrypoints
        run: |
          python dev.py --help >/dev/null
          set +e
          output=$(python dev_env.py --overview 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -q 'DEVTO_API_KEY is not set'
